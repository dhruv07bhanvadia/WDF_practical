<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

        <section aria-labelledby="login-heading">
            <h2 id="login-heading">Student Login</h2>

                <input type="text" id="studentId" name="studentId" required aria-required="true">

        </section>
